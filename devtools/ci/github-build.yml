name: build
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[test]' && pytest -q
  swexport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet build swexport/swexport.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with: {name: swexport, path: out/swexport.exe}
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" out/swexport.exe --clobber
        env: {GH_TOKEN: "${{ github.token }}"}
