[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swreader"
version = "0.1.0"
description = "Read SolidWorks documents (.SLDPRT/.SLDASM/.SLDDRW) without SolidWorks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["olefile>=0.46"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swread = "swreader.cli:main"

[tool.setuptools]
packages = ["swreader"]
